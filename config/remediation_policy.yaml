# Remediations the agent may auto-apply vs must escalate to a human.
# Used by ValidateRemediationPlan (Mode B: split auto vs human_review_queue).

# hold_and_report — apply auto-safe actions; queue the rest for humans (recommended)
# fail_run          — fail validation if any action requires human approval
# skip_risky        — same as hold_and_report (alias)
on_human_required:
  mode: hold_and_report

breaking_change_rules:
  # 1.x → 2.x (or higher major) requires human approval
  major_bump_requires_approval: true
  # remove / replace often need design review
  deny_remove_without_approval: true
  deny_replace_without_approval: true

# Exact coordinates or globs that always need a human (even for patch bumps)
require_human_approval:
  - coordinate: "org.springframework.boot:spring-boot-dependencies"
    reason: "Spring Boot BOM — platform-wide upgrade risk"
  - coordinate: "org.springframework.boot:spring-boot-starter-parent"
    reason: "Spring Boot parent POM — platform-wide upgrade risk"
  - coordinate: "org.hibernate:hibernate-core"
    reason: "Hibernate major API surface; breaking changes common"
  - coordinate: "org.hibernate.orm:hibernate-core"
    reason: "Hibernate 6+ coordinate; breaking changes common"
  - artifact_glob: "*-bom"
    reason: "BOM changes need architect review"
  - artifact_glob: "*-dependencies"
    reason: "Dependency BOM / aggregator — review required"

# Optional allowlist: if non-empty, ONLY these coordinates may auto-apply
# (everything else requires human). Leave empty to use denylist + heuristics.
auto_apply_allowed: []
