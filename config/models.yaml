# Model assignments for the FOSSA remediation agent network.
# Actual LLM definitions live in neuro-san/registries/mistral_llm_info.hocon
# Override at runtime with REMEDIATION_LLM_MODEL (feeds sly_data llm_config).

orchestration:
  model: deepseek-v4-flash
  temperature: 0.0
  note: Primary model for fossa_orchestrator + remediation_pipeline (DeepSeek V4 Flash)
  agents:
    - fossa_orchestrator
    - remediation_pipeline

coding:
  model: deepseek-v4-flash
  temperature: 0.0
  note: Same as network llm_config (pipeline plans + tool routing)
  agents:
    - remediation_pipeline

fallback:
  model: deepseek-v4-pro
  note: Optional fallback via REMEDIATION_LLM_FALLBACK for harder reasoning steps
